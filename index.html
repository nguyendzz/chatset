<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Chat sex Pro Max</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
    --bg-base: #05070d;
    --glass-border: rgba(255, 255, 255, 0.08);
    --ag-blue: #4285f4;
    --ag-cyan: #22d3ee;
    --ag-purple: #a855f7;
    --ag-green: #10a37f;
    --text-main: #f3f6fc;
    --text-muted: #8b9bb4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
    position: relative;
}
.ag-aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 18% 22%, rgba(66, 133, 244, 0.14), transparent 42%),
        radial-gradient(circle at 82% 28%, rgba(168, 85, 247, 0.12), transparent 44%),
        radial-gradient(circle at 52% 85%, rgba(16, 163, 127, 0.13), transparent 46%),
        radial-gradient(circle at 75% 75%, rgba(34, 211, 238, 0.08), transparent 38%);
    animation: auroraDrift 18s ease-in-out infinite alternate;
    filter: blur(28px);
}
@keyframes auroraDrift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-2%, 2%) scale(1.04); }
    100% { transform: translate(2%, -1%) scale(1.02); }
}
#ag-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}
#ag-cursor-halo {
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(66, 133, 244, 0.11) 0%, rgba(168, 85, 247, 0.06) 35%, rgba(16, 163, 127, 0.03) 60%, transparent 72%);
}
.ag-click-ring {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%) scale(0);
    width: 90px;
    height: 90px;
    border: 1.5px solid rgba(34, 211, 238, 0.85);
    box-shadow: 0 0 24px rgba(66, 133, 244, 0.55), inset 0 0 14px rgba(168, 85, 247, 0.45);
    animation: clickExpand 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes clickExpand {
    0% { transform: translate(-50%, -50%) scale(0.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.55); opacity: 0; }
}
.ag-glow {
    position: relative;
    overflow: hidden;
    transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
.ag-glow::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(66, 133, 244, 0.22), rgba(168, 85, 247, 0.10) 45%, transparent 72%);
}
.ag-glow:hover::before { opacity: 1; }
.ag-glow:hover {
    border-color: rgba(120, 180, 255, 0.38);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 18px rgba(66, 133, 244, 0.16);
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.24); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(66, 133, 244, 0.55); }

.sidebar {
    width: 356px;
    flex-shrink: 0;
    background: rgba(10, 14, 24, 0.78);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
    z-index: 3;
}
.sidebar > * { flex-shrink: 0; }
.section-card {
    background: rgba(18, 24, 39, 0.55);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
    background: linear-gradient(90deg, #60a5fa, #34d399, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.sidebar label { font-size: 11.5px; color: var(--text-muted); display: block; margin-top: 2px; }
.sidebar input[type="text"],
.sidebar input[type="password"],
.sidebar input[type="number"],
.sidebar select {
    width: 100%;
    padding: 8px 11px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(7, 10, 18, 0.82);
    color: var(--text-main);
    font-size: 12.5px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.sidebar input:focus, .sidebar select:focus {
    border-color: rgba(66, 133, 244, 0.65);
    box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.16);
}
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: linear-gradient(135deg, rgba(66, 133, 244, 0.88), rgba(16, 163, 127, 0.88));
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn-sec {
    background: rgba(26, 33, 50, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #dbe6f5;
}
.btn-sec:hover { background: rgba(37, 48, 72, 0.92); }
.btn-danger {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.32);
    color: #fca5a5;
}
.btn-danger:hover { background: rgba(239, 68, 68, 0.24); border-color: rgba(239, 68, 68, 0.55); }
.caption { font-size: 11px; color: var(--text-muted); line-height: 1.45; }
.check-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #dbe6f5; cursor: pointer; user-select: none; }
.check-row input { width: auto; accent-color: var(--ag-cyan); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #10b981; box-shadow: 0 0 10px #10b981; }
.status-dot.warn { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
.status-dot.err { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

.conv-list { display: flex; flex-direction: column; gap: 5px; max-height: 170px; overflow-y: auto; }
.conv-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    background: rgba(9, 13, 22, 0.55);
    border: 1px solid transparent;
}
.conv-item.active {
    background: linear-gradient(135deg, rgba(66, 133, 244, 0.16), rgba(16, 163, 127, 0.14));
    border-color: rgba(66, 133, 244, 0.42);
}
.conv-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.del-btn { background: none; border: none; color: #f87171; cursor: pointer; margin-left: 6px; font-size: 12px; opacity: 0.75; }
.del-btn:hover { opacity: 1; transform: scale(1.15); }

.metric-box {
    background: rgba(8, 12, 22, 0.78);
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    padding: 10px 8px;
    text-align: center;
}
.metric-lbl { font-size: 11px; color: var(--text-muted); }
.metric-val { font-size: 15px; font-weight: 700; color: #ffffff; margin-top: 3px; }

.balance-card {
    background: linear-gradient(135deg, #2563eb 0%, #10a37f 55%, #7c3aed 100%);
    background-size: 200% 200%;
    animation: gradientShift 6s ease infinite;
    border-radius: 12px;
    padding: 12px;
    color: #fff;
    text-align: center;
    box-shadow: 0 8px 24px rgba(16, 163, 127, 0.24);
}
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.balance-amount { font-size: 24px; font-weight: 800; }
.balance-label { font-size: 11px; opacity: 0.9; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.tab-btn {
    padding: 7px 4px;
    border-radius: 9px;
    border: 1px solid var(--glass-border);
    background: rgba(8, 12, 22, 0.75);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}
.tab-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.22); }
.tab-btn.active {
    background: linear-gradient(135deg, rgba(66, 133, 244, 0.22), rgba(16, 163, 127, 0.22));
    color: #7dd3fc;
    border-color: rgba(56, 189, 248, 0.5);
}
.stats-card {
    background: linear-gradient(135deg, rgba(16, 163, 127, 0.08), rgba(66, 133, 244, 0.08));
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 12px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.55;
    height: auto;
    overflow: visible;
}
.stats-card h4 { margin-bottom: 6px; font-size: 12.5px; color: #34d399; }
.table-wrap { width: 100%; overflow-x: auto; margin-top: 8px; }
.stats-table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
.stats-table th {
    background: rgba(66, 133, 244, 0.14);
    color: #93c5fd;
    padding: 6px 5px;
    text-align: left;
    border-bottom: 1px solid rgba(66, 133, 244, 0.3);
}
.stats-table td { padding: 6px 5px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.stats-table tr:last-child td { border-bottom: none; }

.main { flex: 1; display: flex; flex-direction: column; height: 100vh; z-index: 2; min-width: 0; }
.header {
    padding: 15px 26px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(10, 14, 24, 0.58);
    backdrop-filter: blur(18px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.brand-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(90deg, #ffffff 0%, #93c5fd 45%, #34d399 78%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 13px;
    border-radius: 999px;
    background: rgba(16, 24, 39, 0.72);
    border: 1px solid rgba(56, 189, 248, 0.25);
    font-size: 12px;
    color: #cbd5e1;
}

.chat-box { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.welcome-panel {
    margin: auto;
    max-width: 560px;
    text-align: center;
    padding: 34px 28px;
    border-radius: 24px;
    background: rgba(14, 20, 34, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(66, 133, 244, 0.08);
}
.welcome-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    color: #7dd3fc;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.28);
    margin-bottom: 14px;
}
.welcome-panel h2 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(120deg, #fff, #93c5fd, #6ee7b7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.welcome-panel p { font-size: 13.5px; color: var(--text-muted); line-height: 1.65; }

.msg-row { display: flex; gap: 12px; max-width: 84%; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
.msg-row.assistant { align-self: flex-start; animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideInRight { from { opacity: 0; transform: translateX(26px) scale(0.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-26px) scale(0.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 19px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar svg { width: 24px; height: 24px; }

.bubble {
    padding: 14px 18px;
    line-height: 1.65;
    font-size: 14px;
    word-wrap: break-word;
    overflow-x: auto;
    backdrop-filter: blur(14px);
}
.msg-row.user .bubble {
    background: linear-gradient(135deg, rgba(66, 133, 244, 0.22), rgba(139, 92, 246, 0.18));
    border: 1px solid rgba(96, 165, 250, 0.34);
    border-radius: 20px 20px 5px 20px;
    text-align: right;
}
.msg-row.assistant .bubble {
    background: rgba(15, 21, 35, 0.76);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px 20px 20px 5px;
}
.bubble img.preview { max-width: 260px; border-radius: 12px; margin: 6px 0; display: block; border: 1px solid rgba(255,255,255,0.1); }
.msg-row.user .bubble img.preview { margin-left: auto; }

.code-block-wrapper { position: relative; margin: 10px 0; text-align: left; }
.code-block-wrapper pre { background: #070a12; border: 1px solid rgba(255,255,255,0.08); padding: 13px; border-radius: 11px; overflow-x: auto; }
.code-block-wrapper code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
.code-copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(15, 23, 42, 0.85);
    color: #e2e8f0;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: 0.2s;
}
.code-block-wrapper:hover .code-copy-btn { opacity: 1; }
.code-copy-btn:hover, .code-copy-btn.copied { background: var(--ag-green); color: #fff; opacity: 1; }

.thinking-card {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 14px;
    background: linear-gradient(110deg, rgba(66, 133, 244, 0.12) 25%, rgba(16, 163, 127, 0.24) 50%, rgba(168, 85, 247, 0.12) 75%);
    background-size: 220% 100%;
    animation: shimmerSlide 2s linear infinite;
    border: 1px solid rgba(56, 189, 248, 0.34);
    margin-bottom: 8px;
    font-size: 13px;
}
@keyframes shimmerSlide { 0% { background-position: -220% 0; } 100% { background-position: 220% 0; } }
@keyframes gptSpinPulse { 0% { transform: rotate(0deg) scale(0.95); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(0.95); } }
@keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.35; } 40% { transform: translateY(-4px); opacity: 1; } }
.thinking-logo { width: 20px; height: 20px; fill: #38bdf8; animation: gptSpinPulse 2.4s infinite; }
.thinking-dots span { display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: #38bdf8; animation: dotBounce 1.3s infinite ease-in-out both; }
.thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
.thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

.reasoning {
    background: rgba(66, 133, 244, 0.08);
    border-left: 3px solid var(--ag-cyan);
    padding: 9px 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: #94a3b8;
}
.reasoning summary { cursor: pointer; font-weight: 600; color: #38bdf8; }
.notice-box {
    background: rgba(245, 158, 11, 0.14);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fcd34d;
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 12px;
    margin-bottom: 8px;
}
.copy-btn-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.copy-btn {
    padding: 5px 11px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #e2e8f0;
    font-size: 11.5px;
    cursor: pointer;
    transition: 0.2s;
}
.copy-btn:hover { background: rgba(56, 189, 248, 0.16); border-color: rgba(56, 189, 248, 0.5); }
.copy-btn.copied { color: #34d399; border-color: #34d399; }
.meta { font-size: 11px; color: var(--text-muted); margin-top: 8px; }

.input-area {
    padding: 16px 26px;
    border-top: 1px solid var(--glass-border);
    background: rgba(10, 14, 24, 0.72);
    backdrop-filter: blur(20px);
}
.input-shell {
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(7, 10, 18, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 7px 10px;
}
.input-shell:focus-within {
    border-color: rgba(66, 133, 244, 0.65);
    box-shadow: 0 0 24px rgba(66, 133, 244, 0.18);
}
.input-shell textarea {
    flex: 1;
    resize: none;
    height: 40px;
    padding: 9px 8px;
    border: none;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
}
.file-label {
    padding: 8px 11px;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 11px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
}
.live-badge-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 4px;
}
.model-chip {
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
    cursor: pointer;
    transition: 0.2s;
}
.model-chip:hover { border-color: rgba(56, 189, 248, 0.55); transform: translateY(-1px); }
.model-chip.live { border-color: rgba(16, 185, 129, 0.55); color: #6ee7b7; background: rgba(16, 185, 129, 0.12); }
.model-chip.dead { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
</style>
</head>
<body>
<div class="ag-aurora"></div>
<canvas id="ag-canvas"></canvas>
<div id="ag-cursor-halo"></div>

<div class="sidebar">
    <div class="section-card ag-glow">
        <div class="section-title"><span>💬 Cuộc hội thoại</span><span id="conv-count" style="font-size:11px;color:#94a3b8;-webkit-text-fill-color:#94a3b8;">0</span></div>
        <div class="row-2">
            <button class="btn ag-glow" onclick="newChat()">➕ Mới</button>
            <button class="btn btn-sec ag-glow" onclick="renderAll()">🔄 Làm mới</button>
        </div>
        <div class="conv-list" id="conv-list"></div>
    </div>

    <div class="section-card ag-glow">
        <div class="section-title"><span>⚙️ Cấu hình AI & Live Model</span><span class="status-dot" id="api-dot"></span></div>
        <label>Nhà cung cấp (Provider)</label>
        <select id="provider" onchange="onProviderChange()">
            <option value="xingchi">xingchiapi (OpenAI-compat)</option>
            <option value="gemini">Gemini (Google AI Studio)</option>
        </select>

        <label>Cloudflare Worker Proxy</label>
        <input type="text" id="worker-url" value="https://aigene.nguyendz290.workers.dev" oninput="saveWorkerUrl()">

        <label>API Key riêng (để trống = dùng Key bảo mật trên Worker)</label>
        <input type="password" id="api-key" placeholder="Đang dùng Key bảo mật trên Worker" oninput="saveCurrentKey()">

        <div id="xingchi-extra" style="display:flex;flex-direction:column;gap:6px;">
            <label>Chế độ kết nối</label>
            <select id="mode">
                <option value="Codex CLI (/v1/responses)">Codex CLI (/v1/responses)</option>
                <option value="OpenCode (/v1/chat/completions)" selected>OpenCode (/v1/chat/completions)</option>
                <option value="ZCode (/v1/chat/completions)">ZCode (/v1/chat/completions)</option>
                <option value="Hermes Agent (/v1/chat/completions)">Hermes Agent (/v1/chat/completions)</option>
            </select>
        </div>

        <label>Model đang dùng</label>

function initAntigravityFX() {
    const canvas = document.getElementById("ag-canvas");
    const ctx = canvas.getContext("2d");
    const halo = document.getElementById("ag-cursor-halo");
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    const mouse = { x: w / 2, y: h / 2, active: false };
    const palette = ["#4285f4", "#22d3ee", "#a855f7", "#10a37f", "#93c5fd"];
    const particles = [];
    const bursts = [];

    for (let i = 0; i < 42; i++) {
        particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.35,
            vy: -(0.18 + Math.random() * 0.42),
            r: 1.2 + Math.random() * 2.2,
            color: palette[i % palette.length],
            alpha: 0.25 + Math.random() * 0.45
        });
    }

    window.addEventListener("resize", () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    });

    window.addEventListener("mousemove", e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
        halo.style.left = e.clientX + "px";
        halo.style.top = e.clientY + "px";
        document.querySelectorAll(".ag-glow").forEach(el => {
            const rect = el.getBoundingClientRect();
            if (e.clientX >= rect.left - 120 && e.clientX <= rect.right + 120 && e.clientY >= rect.top - 120 && e.clientY <= rect.bottom + 120) {
                el.style.setProperty("--mx", (e.clientX - rect.left) + "px");
                el.style.setProperty("--my", (e.clientY - rect.top) + "px");
            }
        });
    });

    window.addEventListener("mousedown", e => {
        const ring = document.createElement("div");
        ring.className = "ag-click-ring";
        ring.style.left = e.clientX + "px";
        ring.style.top = e.clientY + "px";
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 680);
        for (let i = 0; i < 10; i++) {
            const ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
            const spd = 1.6 + Math.random() * 2.8;
            bursts.push({
                x: e.clientX,
                y: e.clientY,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd,
                r: 1.6 + Math.random() * 1.8,
                life: 1,
                color: palette[i % palette.length]
            });
        }
    });

    function tick() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
            if (mouse.active) {
                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 130 && dist > 1) {
                    const force = (130 - dist) / 130;
                    p.x += (dx / dist) * force * 1.6;
                    p.y += (dy / dist) * force * 1.6;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = `rgba(96, 165, 250, ${force * 0.22})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fill();
        }
        for (let i = bursts.length - 1; i >= 0; i--) {
            const b = bursts[i];
            b.x += b.vx;
            b.y += b.vy;
            b.vx *= 0.94;
            b.vy *= 0.94;
            b.life -= 0.035;
            if (b.life <= 0) { bursts.splice(i, 1); continue; }
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * b.life, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.globalAlpha = b.life;
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(tick);
    }
    tick();
}

    if (ck) h["X-Custom-Key"] = ck;
    if (modeName) h["X-Client-Mode"] = modeName;
    return h;
}

function populateModelSelect() {

        `${w}/gemini-studio/v1beta/models/${model}:${action}`

async function refreshModels(notify = true) {
    const p = document.getElementById("provider").value;
    const w = getWorkerBase();
    const btn = document.getElementById("btn-refresh-models");
    const log = document.getElementById("conn-log");
    btn.disabled = true;
    btn.textContent = "⏳ Đang tải...";
    let fetched = [];
    try {
        if (p === "gemini") {
            const urls = [`${w}/gemini/v1/publishers/google/models`, `${w}/gemini-studio/v1beta/models`];
            for (const u of urls) {
                try {
                    const r = await fetch(u, { headers: buildWorkerHeaders("gemini") });
                    if (r.ok) {
                        const data = await r.json();
                        const raw = (data.models || []).map(m => (m.name || "").replace(/^.*models\//, "")).filter(id => id && /gemini/i.test(id) && !/embed|imagen|aqa|tts/i.test(id));
                        if (raw.length) {
                            const prio = ["gemini-3.5-flash-lite", "gemini-3.5-flash", "gemini-3.8-flash", "gemini-2.5-flash", "gemini-2.5-pro"];
                            fetched = [...prio.filter(x => raw.includes(x)), ...raw.filter(x => !prio.includes(x))].slice(0, 14);
                            break;
                        }
                    }
                } catch {}
            }
        } else {
            const r = await fetch(`${w}/xingchi/models`, { headers: buildWorkerHeaders("xingchi", "Codex CLI (/v1/responses)") });
            if (r.ok) {
                const data = await r.json();
                const raw = (data.data || []).map(m => m.id).filter(id => id && !/image|whisper|tts/i.test(id));
                const prio = ["gpt-6.1-sol", "gpt-6-astra", "gpt-6", "gpt-5.6-sol"];
                fetched = [...prio.filter(x => raw.includes(x)), ...raw.filter(x => !prio.includes(x))].slice(0, 14);
            }
        }
    } catch {}
    if (fetched.length) {
        providerModels[p] = fetched;
        populateModelSelect();
        if (notify) log.innerHTML = `<span style="color:#34d399">✅ Đã đồng bộ ${fetched.length} model từ server.</span>`;
    } else if (notify) {
        log.innerHTML = `<span style="color:#fbbf24">ℹ️ Đang dùng danh sách model mặc định.</span>`;
    }
    btn.disabled = false;
    btn.textContent = "🔄 Cập nhật Model";
}

async function pingSingleModel(p, model) {
    const t0 = performance.now();
    if (p === "gemini") {
        for (const u of getGeminiEndpoints(model, false)) {
            try {
                const r = await fetch(u, {
                    method: "POST",
                    headers: buildWorkerHeaders("gemini"),
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Say OK" }] }] })
                });
                if (r.ok) return { ok: true, ms: ((performance.now() - t0) / 1000).toFixed(2) };
            } catch {}
        }
        return { ok: false, err: "Lỗi/Không hỗ trợ" };
    } else {
        const w = getWorkerBase();
        for (const [mName, cfg] of Object.entries(CLIENT_MODES)) {
            try {
                const payload = cfg.endpoint === "/responses"
                    ? { model, input: [{ role: "user", content: [{ type: "input_text", text: "Say OK" }] }], max_output_tokens: 8, store: false, stream: false }
                    : { model, messages: [{ role: "user", content: "Say OK" }], max_tokens: 8, stream: false };
                const r = await fetch(`${w}/xingchi${cfg.endpoint}`, {
                    method: "POST",
                    headers: buildWorkerHeaders("xingchi", mName),
                    body: JSON.stringify(payload)
                });
                if (r.ok) return { ok: true, ms: ((performance.now() - t0) / 1000).toFixed(2), mode: mName };
            } catch {}
        }
        return { ok: false, err: "Offline / 503" };
    }
}

async function checkLiveModels() {
    const p = document.getElementById("provider").value;
    const btn = document.getElementById("btn-check-live");
    const log = document.getElementById("conn-log");
    btn.disabled = true;
    btn.textContent = "⏳ Đang quét...";
    log.innerHTML = "Đang kiểm tra các model đang Live...";
    setStatus("Đang Check Live AI...", "warn");

    const list = (providerModels[p] || []).slice(0, 6);
    const results = await Promise.all(list.map(async m => ({ model: m, ...(await pingSingleModel(p, m)) })));
    let firstLive = null;
    const lines = [];
    results.forEach(res => {
        modelStatusMap[`${p}:${res.model}`] = res;
        if (res.ok && !firstLive) firstLive = res;
        lines.push(res.ok ? `<span style="color:#34d399">🟢 ${res.model} (${res.ms}s)</span>` : `<span style="color:#f87171">🔴 ${res.model} (${res.err})</span>`);
    });
    populateModelSelect();
    if (firstLive) {
        document.getElementById("model").value = firstLive.model;
        if (firstLive.mode) document.getElementById("mode").value = firstLive.mode;
        saveCurrentModel();
        setStatus(`LIVE: ${firstLive.model} (${firstLive.ms}s)`, "ok");
    } else {
        setStatus("Không có model Live", "err");
    }
    log.innerHTML = lines.join("<br>");
    btn.disabled = false;
    btn.textContent = "⚡ Check Live AI";
}

function uploadAvatar(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const c = document.createElement("canvas");
            c.width = c.height = 200;
            const side = Math.min(img.width, img.height);
            c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 200, 200);
            userAvatarData = c.toDataURL("image/jpeg", 0.9);
            localStorage.setItem("csp_avatar_v3", userAvatarData);
            renderMessages();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function getAvatarHtml(role) {

}

function renderStatsTab() {
    const el = document.getElementById("tab-content");
    const daily = stats.daily || {};
    const today = new Date();
    const daysMap = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    let rows = "";

    if (currentTab === "detail") {
        Object.keys(daily).sort().reverse().forEach(d => {
            const v = daily[d];
            rows += `<tr><td>${d.slice(5)}</td><td>${v.messages}</td><td>${(v.input_tokens || 0).toLocaleString()}</td><td>${(v.output_tokens || 0).toLocaleString()}</td><td>$${v.cost.toFixed(4)}</td></tr>`;
        });
        el.innerHTML = `<h4>📋 Chi tiết tất cả ngày</h4><div class="table-wrap"><table class="stats-table"><tr><th>Ngày</th><th>💬</th><th>In</th><th>Out</th><th>Chi phí</th></tr>${rows || "<tr><td colspan='5'>Chưa có dữ liệu</td></tr>"}</table></div>`;
        return;
    }

    const period = currentTab === "week" ? 7 : currentTab === "month" ? 30 : 90;
    let sumTok = 0, sumCost = 0, sumMsg = 0;
    for (let i = 0; i < period; i++) {
        const dt = new Date(today);
        dt.setDate(today.getDate() - i);
        const key = dt.toISOString().slice(0, 10);
        const v = daily[key] || { tokens: 0, cost: 0, messages: 0 };
        sumTok += v.tokens; sumCost += v.cost; sumMsg += v.messages;
        if (i < 7 || v.tokens > 0) {
            rows += `<tr><td>${key.slice(5)} (${daysMap[dt.getDay()]})</td><td>${v.messages}</td><td>${v.tokens.toLocaleString()}</td><td>$${v.cost.toFixed(4)}</td></tr>`;
        }
    }
    const title = currentTab === "week" ? "📅 7 ngày qua" : currentTab === "month" ? "📆 30 ngày qua" : "📆 90 ngày qua";
    el.innerHTML = `
        <h4>${title}</h4>
        <div>🔢 <strong>${sumTok.toLocaleString()}</strong> &nbsp;|&nbsp; 💰 <strong>$${sumCost.toFixed(4)}</strong> &nbsp;|&nbsp; 💬 ${sumMsg}</div>
        <div class="table-wrap"><table class="stats-table"><tr><th>Ngày</th><th>💬</th><th>Token</th><th>Chi phí</th></tr>${rows}</table></div>
    `;
}

        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);

        btn.innerText = "📋 Copy";
        btn.onclick = () => copyText(pre.innerText, btn);

function addCopyButtons(row, text) {

function compressImage(file) {
    return new Promise(res => {
        const r = new FileReader();
        r.onload = e => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height, max = 1280;
                if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement("canvas");
                c.width = w; c.height = h;
                c.getContext("2d").drawImage(img, 0, 0, w, h);
                res(c.toDataURL("image/jpeg", 0.85));
            };
            img.src = e.target.result;
        };
        r.readAsDataURL(file);
    });
}

function readTextFile(file) {
    return new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(`--- Nội dung tệp: ${file.name} ---\n\`\`\`\n${e.target.result}\n\`\`\``);
        r.readAsText(file);
    });
}

function resolveEffort(label, text, hasFiles) {
    const eff = THINKING_LEVELS[label].effort;
    if (eff !== "auto") return eff;
    if (hasFiles || text.length > 300 || /code|python|javascript|lập trình|sửa lỗi|debug|thuật toán|toán|api|sql|ielts|essay/i.test(text)) return "high";
    return text.length < 60 ? "low" : "medium";
}

async function streamGemini(model, messages, onReasoning, onContent) {
    const contents = messages.map(m => {
        const parts = [{ text: m.full_text }];
        if (m.role === "user" && m.image_urls) {
            m.image_urls.forEach(u => {
                const b64 = u.split(",")[1];
                if (b64) parts.push({ inline_data: { mime_type: "image/jpeg", data: b64 } });
            });
        }
        return { role: m.role === "assistant" ? "model" : "user", parts };
    });

    let lastErr = null;
    for (const url of getGeminiEndpoints(model, true)) {
        try {
            const res = await fetch(url, {
                method: "POST",
                headers: buildWorkerHeaders("gemini"),
                body: JSON.stringify({ contents })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status} - ${await res.text()}`);
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = "", usage = null;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const lines = buf.split("\n");
                buf = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith("data: ")) continue;
                    const str = line.slice(6).trim();
                    if (!str || str === "[DONE]") continue;
                    try {
                        const obj = JSON.parse(str);
                        if (obj.usageMetadata) {
                            usage = {
                                prompt_tokens: obj.usageMetadata.promptTokenCount || 0,
                                completion_tokens: obj.usageMetadata.candidatesTokenCount || 0
                            };
                        }
                        const parts = obj.candidates?.[0]?.content?.parts || [];
                        for (const pt of parts) {
                            if (pt.thought && pt.text) onReasoning(pt.text);
                            else if (pt.text) onContent(pt.text);
                        }
                    } catch {}
                }
            }
            return usage;
        } catch (e) {
            lastErr = e;
        }
    }
    throw lastErr || new Error("Không gọi được Gemini API");
}

async function streamXingchi(model, modeName, effort, messages, onReasoning, onContent) {
    const cfg = CLIENT_MODES[modeName];
    const w = getWorkerBase();
    const payload = cfg.endpoint === "/responses"
        ? {
            model,
            instructions: "You are a helpful AI assistant. Respond clearly and completely in the user's language.",
            input: messages.map(m => m.role === "user"
                ? { role: "user", content: [{ type: "input_text", text: m.full_text }, ...(m.image_urls || []).map(u => ({ type: "input_image", image_url: u }))] }
                : { role: "assistant", content: [{ type: "output_text", text: m.full_text }] }
            ),
            reasoning: { effort, summary: "auto" },
            store: false,
            stream: true
        }
        : {
            model,
            messages: messages.map(m => (m.role === "user" && m.image_urls && m.image_urls.length)
                ? { role: "user", content: [{ type: "text", text: m.full_text }, ...m.image_urls.map(u => ({ type: "image_url", image_url: { url: u } }))] }
                : { role: m.role, content: m.full_text }
            ),
            reasoning_effort: effort,
            stream: true,
            stream_options: { include_usage: true }
        };

    const res = await fetch(`${w}/xingchi${cfg.endpoint}`, {
        method: "POST",
        headers: buildWorkerHeaders("xingchi", modeName),
        body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} - ${await res.text()}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", usage = null;
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const str = line.slice(6).trim();
            if (str === "[DONE]") break;
            try {
                const obj = JSON.parse(str);
                if (obj.usage) usage = obj.usage;
                const delta = obj.choices?.[0]?.delta || {};
                const rPiece = delta.reasoning_content || delta.reasoning || (["response.reasoning_summary_text.delta", "response.reasoning_text.delta"].includes(obj.type) ? obj.delta : "");
                if (rPiece) onReasoning(rPiece);
                const cPiece = delta.content || (["response.output_text.delta", "response.content_part.delta"].includes(obj.type) ? obj.delta : "");
                if (cPiece) onContent(cPiece);
                if (obj.type === "response.completed" && obj.response?.usage) usage = obj.response.usage;
            } catch {}
        }
    }
    return usage;
}

async function sendMessage() {
    const input = document.getElementById("msg-input");
    const fileInput = document.getElementById("file-input");
    let text = input.value.trim();
    const files = [...fileInput.files];
    if (!text && !files.length) return;
    if (!text && files.length) text = "Hãy phân tích và tóm tắt chi tiết nội dung các tệp đính kèm này.";

    const docTexts = [], imageUrls = [], attachedNames = [];
    for (const f of files) {
        attachedNames.push(f.name);
        if (f.type.startsWith("image/")) imageUrls.push(await compressImage(f));
        else docTexts.push(await readTextFile(f));
    }
    const fullText = docTexts.length ? `${text}\n\n${docTexts.join("\n\n")}` : text;
    input.value = ""; fileInput.value = ""; updateFileCount();

    if (!convs[currentId]) convs[currentId] = { id: currentId, title: text.slice(0, 52), updated: Date.now(), messages: [] };
    convs[currentId].messages.push({ role: "user", display_text: text, full_text: fullText, image_urls: imageUrls, attached_names: attachedNames });
    convs[currentId].updated = Date.now();
    appendBubble("user", text, "", "", imageUrls, attachedNames);

    const primaryProvider = document.getElementById("provider").value;
    const autoFallback = document.getElementById("auto-fallback").checked;
    const levelLabel = document.getElementById("effort").value;
    const effort = resolveEffort(levelLabel, text, files.length > 0);
    const mult = parseFloat(document.getElementById("multiplier").value) || 0.25;

    const aiRow = appendBubble("assistant", "");
    const bubble = aiRow.querySelector(".bubble");
    const contentEl = aiRow.querySelector(".content");
    const metaEl = aiRow.querySelector(".meta");
    const thinkEl = document.createElement("div");
    thinkEl.className = "thinking-card";
    bubble.insertBefore(thinkEl, contentEl);

    const t0 = Date.now();
    let activeProvider = primaryProvider;
    let activeModel = document.getElementById("model").value;
    let answer = "", reasoning = "", reasonEl = null, usage = null, lastErr = null;

    const updateThink = (phase) => {
        const sec = ((Date.now() - t0) / 1000).toFixed(1);
        thinkEl.innerHTML = `<svg class="thinking-logo" viewBox="0 0 24 24"><path d="${SPARKLE_PATH}"/></svg><span><strong>${phase}</strong> (${activeModel} · ${sec}s)</span><span class="thinking-dots"><span></span><span></span><span></span></span>`;
    };
    updateThink("Đang gửi & suy nghĩ");

    document.getElementById("send-btn").disabled = true;
    setStatus("Tao đang xử lý...", "warn");

    const addNotice = (msg) => {
        const n = document.createElement("div");
        n.className = "notice-box";
        n.textContent = msg;
        bubble.insertBefore(n, thinkEl);
    };

    const onReasoning = (piece) => {
        reasoning += piece;
        updateThink("Đang tư duy từng bước");
        if (!reasonEl) {
            reasonEl = document.createElement("details");
            reasonEl.className = "reasoning";
            reasonEl.open = true;
            reasonEl.innerHTML = "<summary>💭 Đang suy nghĩ, chờ em chút thôi. </summary><div></div>";
            bubble.insertBefore(reasonEl, contentEl);
        }
        reasonEl.querySelector("div").innerHTML = marked.parse(reasoning);
        document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
    };

    const onContent = (piece) => {
        if (!answer) thinkEl.remove();
        answer += piece;
        contentEl.innerHTML = marked.parse(answer);
        document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
    };

    const plan = [{ provider: primaryProvider, model: activeModel, mode: document.getElementById("mode").value }];
    if (autoFallback) {
        if (primaryProvider === "xingchi") {
            plan.push({ provider: "xingchi", model: "gpt-6.1-sol", mode: "OpenCode (/v1/chat/completions)" });
            plan.push({ provider: "gemini", model: savedModels.gemini || PROVIDERS.gemini.defaultModels[0] });
        } else {
            const gList = providerModels.gemini.filter(m => m !== activeModel).slice(0, 2);
            gList.forEach(m => plan.push({ provider: "gemini", model: m }));
            plan.push({ provider: "xingchi", model: savedModels.xingchi || "gpt-6.1-sol", mode: "OpenCode (/v1/chat/completions)" });
        }
    }

    for (let i = 0; i < plan.length; i++) {
        const step = plan[i];
        activeProvider = step.provider;
        activeModel = step.model;
        if (i > 0) {
            addNotice(`⚠️ Kênh trước lỗi → Tự chuyển sang ${PROVIDERS[activeProvider].name} (${activeModel})`);
            updateThink("Đang thử kênh dự phòng");
        }
        try {
            if (activeProvider === "gemini") {
                usage = await streamGemini(activeModel, convs[currentId].messages, onReasoning, onContent);
            } else {
                usage = await streamXingchi(activeModel, step.mode || "OpenCode (/v1/chat/completions)", effort, convs[currentId].messages, onReasoning, onContent);
            }
            lastErr = null;
            break;
        } catch (ex) {
            lastErr = ex;
            if (answer) break;
        }
    }

    thinkEl.remove();
    if (lastErr && !answer) {
        contentEl.innerHTML = `<span style="color:#f87171">Lỗi gọi API: ${lastErr.message}</span>`;
        setStatus("Mất kết nối ♫", "err");
    } else {
        const sec = ((Date.now() - t0) / 1000).toFixed(1);
        if (reasonEl) {
            reasonEl.querySelector("summary").innerText = `✅ Đã load xong trong ${sec}s`;
            reasonEl.open = false;
        }
        decorateCodeBlocks(aiRow);
        addCopyButtons(aiRow, answer);

        let meta = `📊 ${activeModel} (${effort} · ${sec}s)`;
        if (usage) {
            const inTok = usage.prompt_tokens || 0;
            const outTok = usage.completion_tokens || 0;
            const rate = activeModel.includes("astra") ? MODEL_PRICING["gpt-6-astra"] : activeModel.includes("gemini") ? MODEL_PRICING["gemini"] : MODEL_PRICING["gpt-6.1-sol"];
            const cost = ((inTok * rate.input + outTok * rate.output) / 1e6) * mult;
            const totalTok = inTok + outTok;
            sessionCost += cost;
            sessionTokens += totalTok;

            const today = new Date().toISOString().slice(0, 10);
            stats.total_tokens += totalTok;
            stats.total_cost += cost;
            stats.total_messages += 1;
            if (!stats.daily[today]) stats.daily[today] = { tokens: 0, cost: 0, messages: 0, input_tokens: 0, output_tokens: 0 };
            stats.daily[today].tokens += totalTok;
            stats.daily[today].cost += cost;
            stats.daily[today].messages += 1;
            stats.daily[today].input_tokens += inTok;
            stats.daily[today].output_tokens += outTok;
            meta += ` | In: ${inTok.toLocaleString()} · Out: ${outTok.toLocaleString()} | $${cost.toFixed(6)}`;
        }
        metaEl.innerText = meta;
        convs[currentId].messages.push({ role: "assistant", display_text: answer, full_text: answer, reasoning_text: reasoning.trim(), meta });
        saveState();
        renderSidebar();
        setStatus(`Hoàn tất (${sec}s)`, "ok");
    }
    document.getElementById("send-btn").disabled = false;
}

document.getElementById("msg-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

(function boot() {
    initAntigravityFX();
    const savedP = localStorage.getItem("csp_provider_v3") || "xingchi";
    document.getElementById("provider").value = savedP;
    document.getElementById("worker-url").value = localStorage.getItem("csp_worker_v4") || DEFAULT_WORKER;
    updateEffortDesc();
    onProviderChange();
    renderAll();
})();
</script>
</body>
</html>
