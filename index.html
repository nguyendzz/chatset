};

let convs = JSON.parse(localStorage.getItem("csp_convs_v2") || "{}");
let stats = JSON.parse(localStorage.getItem("csp_stats_v2") || '{"total_tokens":0,"total_cost":0,"total_messages":0,"daily":{}}');

let sessionCost = 0, sessionTokens = 0, currentTab = "week";

function initParticles() {
    const bg = document.getElementById("particles-bg");
    for (let i = 0; i < 15; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.width = p.style.height = (2 + Math.random() * 3) + "px";
        p.style.animationDuration = (12 + Math.random() * 20) + "s";
        p.style.animationDelay = Math.random() * 15 + "s";
        bg.appendChild(p);
    }
}

function saveState() {
    localStorage.setItem("csp_convs_v2", JSON.stringify(convs));
    localStorage.setItem("csp_stats_v2", JSON.stringify(stats));
}

function updateEffortDesc() {
    const k = document.getElementById("effort").value;
    document.getElementById("effort-desc").innerText = THINKING_LEVELS[k].desc;
}

function uploadAvatar(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const c = document.createElement("canvas");
            c.width = c.height = 200;
            const side = Math.min(img.width, img.height);
            c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 200, 200);
            userAvatarData = c.toDataURL("image/jpeg", 0.9);
            localStorage.setItem("csp_avatar_v2", userAvatarData);
            renderMessages();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function getAvatarHtml(role) {
    if (role === "user") return userAvatarData ? `<img src="${userAvatarData}">` : "🧑";
    const choice = document.getElementById("ai-avatar-choice").value;
    if (choice === "user" && userAvatarData) return `<img src="${userAvatarData}">`;
    const color = choice === "green" ? "#10a37f" : "#ffffff";
    return `<svg viewBox="0 0 24 24" fill="${color}"><path d="${OPENAI_PATH}"/></svg>`;
}

function renderSidebar() {
    const list = document.getElementById("conv-list");
    const items = Object.values(convs).sort((a, b) => b.updated - a.updated);
    document.getElementById("conv-count").innerText = items.length;
    list.innerHTML = "";
    items.slice(0, 20).forEach(c => {
        const div = document.createElement("div");
        div.className = "conv-item" + (c.id === currentId ? " active" : "");
        div.innerHTML = `<span class="conv-title" onclick="openChat('${c.id}')">${c.id === currentId ? "▶ " : ""}${c.title}</span><button class="del-btn" onclick="delChat('${c.id}')">🗑️</button>`;
        list.appendChild(div);
    });
    document.getElementById("sess-cost").innerText = `$${sessionCost.toFixed(6)}`;
    document.getElementById("sess-tok").innerText = sessionTokens.toLocaleString();
    document.getElementById("alltime-box").innerHTML = `
        <h4>🌐 Tổng cộng (All time)</h4>
        <div>🔢 <strong>${stats.total_tokens.toLocaleString()}</strong> tokens</div>
        <div>💰 <strong>$${stats.total_cost.toFixed(4)}</strong> &nbsp;|&nbsp; 💬 <strong>${stats.total_messages}</strong></div>
    `;
    renderStatsTab();
}

function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderStatsTab();
}

function renderStatsTab() {
    const el = document.getElementById("tab-content");
    const daily = stats.daily || {};
    const today = new Date();
    const daysMap = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    let rows = "";

    if (currentTab === "detail") {
        Object.keys(daily).sort().reverse().forEach(d => {
            const v = daily[d];
            rows += `<tr><td>${d.slice(5)}</td><td>${v.messages}</td><td>${v.tokens.toLocaleString()}</td><td>$${v.cost.toFixed(4)}</td></tr>`;
        });
        el.innerHTML = `<h4>📋 Tất cả ngày</h4><table class="stats-table"><tr><th>Ngày</th><th>💬</th><th>Token</th><th>Chi phí</th></tr>${rows || "<tr><td colspan='4'>Chưa có dữ liệu</td></tr>"}</table>`;
        return;
    }

    const period = currentTab === "week" ? 7 : currentTab === "month" ? 30 : 90;
    let sumTok = 0, sumCost = 0, sumMsg = 0;
    for (let i = 0; i < period; i++) {
        const dt = new Date(today);
        dt.setDate(today.getDate() - i);
        const key = dt.toISOString().slice(0, 10);
        const v = daily[key] || { tokens: 0, cost: 0, messages: 0, input_tokens: 0, output_tokens: 0 };
        sumTok += v.tokens; sumCost += v.cost; sumMsg += v.messages;
        if (i < 7 || v.tokens > 0) {
            rows += `<tr><td>${key.slice(5)} (${daysMap[dt.getDay()]})</td><td>${v.messages}</td><td>${v.tokens.toLocaleString()}</td><td>$${v.cost.toFixed(4)}</td></tr>`;
        }
    }
    const title = currentTab === "week" ? "📅 7 ngày qua" : currentTab === "month" ? "📆 30 ngày qua" : "📆 90 ngày qua";
    el.innerHTML = `
        <h4>${title}</h4>
        <div>🔢 <strong>${sumTok.toLocaleString()}</strong> | 💰 <strong>$${sumCost.toFixed(4)}</strong> | 💬 ${sumMsg}</div>
        <table class="stats-table"><tr><th>Ngày</th><th>💬</th><th>Token</th><th>Chi phí</th></tr>${rows}</table>
    `;
}

function newChat() {
    currentId = Date.now().toString();
    sessionCost = 0; sessionTokens = 0;
    renderAll();
}

function openChat(id) {
    currentId = id;
    sessionCost = 0; sessionTokens = 0;
    renderAll();
}

function delChat(id) {
    delete convs[id];
    saveState();
    if (id === currentId) newChat();
    else renderSidebar();
}

function resetSession() {
    if (convs[currentId]) convs[currentId].messages = [];
    sessionCost = 0; sessionTokens = 0;
    saveState();
    renderAll();
}

function renderAll() {
    renderSidebar();
    renderMessages();
}

function renderMessages() {
    const box = document.getElementById("chat-box");
    box.innerHTML = "";
    const msgs = convs[currentId]?.messages || [];
    msgs.forEach(m => appendBubble(m.role, m.display_text, m.reasoning_text, m.meta, m.image_urls, m.attached_names));
}

function copyText(text, btn) {
    navigator.clipboard.writeText(text);
    const old = btn.innerText;
    btn.classList.add("copied");
    btn.innerText = "✓ Đã sao chép!";
    setTimeout(() => { btn.classList.remove("copied"); btn.innerText = old; }, 1500);
}

function decorateCodeBlocks(container) {
    container.querySelectorAll("pre").forEach(pre => {
        if (pre.parentElement.classList.contains("code-block-wrapper")) return;
        const wrap = document.createElement("div");
        wrap.className = "code-block-wrapper";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = document.createElement("button");
        btn.className = "code-copy-btn";
        btn.innerText = "📋 Copy";
        btn.onclick = () => copyText(pre.innerText, btn);
        wrap.appendChild(btn);
    });
}

function addCopyButtons(row, text) {
    const c = row.querySelector(".copy-btn-container");
    c.innerHTML = "";
    const b1 = document.createElement("button");
    b1.className = "copy-btn";
    b1.innerText = "📋 Sao chép văn bản";
    b1.onclick = () => copyText(text, b1);
    c.appendChild(b1);
    const matches = [...text.matchAll(/```[\w]*\n([\s\S]*?)```/g)];
    matches.forEach((m, i) => {
        const bc = document.createElement("button");
        bc.className = "copy-btn";
        bc.innerText = `💻 Code #${i + 1}`;
        bc.onclick = () => copyText(m[1].trim(), bc);
        c.appendChild(bc);
    });
}

function appendBubble(role, text, reasoning = "", meta = "", images = [], attached = []) {
    const box = document.getElementById("chat-box");
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;
    const attHtml = attached && attached.length ? `<div class="caption">📎 Đã đính kèm: ${attached.join(", ")}</div>` : "";
    const imgHtml = (images || []).map(u => `<img class="preview" src="${u}">`).join("");
    const reasonHtml = reasoning ? `<details class="reasoning"><summary>💭 Quá trình tư duy của AI</summary><div>${marked.parse(reasoning)}</div></details>` : "";
    row.innerHTML = `<div class="avatar">${getAvatarHtml(role)}</div><div class="bubble">${attHtml}${imgHtml}${reasonHtml}<div class="content">${marked.parse(text || "")}</div><div class="copy-btn-container"></div><div class="meta">${meta || ""}</div></div>`;
    decorateCodeBlocks(row);
    if (role === "assistant" && text) addCopyButtons(row, text);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
    return row;
}

function updateFileCount() {
    const n = document.getElementById("file-input").files.length;
    document.getElementById("file-count").innerText = n ? n : "";
}

function compressImage(file) {
    return new Promise(res => {
        const r = new FileReader();
        r.onload = e => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height, max = 1280;
                if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement("canvas");
                c.width = w; c.height = h;
                c.getContext("2d").drawImage(img, 0, 0, w, h);
                res(c.toDataURL("image/jpeg", 0.85));
            };
            img.src = e.target.result;
        };
        r.readAsDataURL(file);
    });
}

function readTextFile(file) {
    return new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(`--- Nội dung tệp: ${file.name} ---\n\`\`\`\n${e.target.result}\n\`\`\``);
        r.readAsText(file);
    });
}

function resolveEffort(label, text, hasFiles) {
    const eff = THINKING_LEVELS[label].effort;
    if (eff !== "auto") return eff;
    if (hasFiles || text.length > 300 || /code|python|javascript|lập trình|sửa lỗi|debug|thuật toán|toán|api|sql|ielts|essay/i.test(text)) return "high";
    return text.length < 60 ? "low" : "medium";
}

function makeHeaders(apiKey, modeName) {
    return {
        "Authorization": `Bearer ${apiKey.trim()}`,
        "Content-Type": "application/json",
        ...CLIENT_MODES[modeName].headers
    };
}

function buildPayload(messages, model, effort, modeName, stream = true) {
    if (CLIENT_MODES[modeName].endpoint === "/responses") {
        const input = messages.map(m => {
            if (m.role === "user") {
                const c = [{ type: "input_text", text: m.full_text }, ...(m.image_urls || []).map(u => ({ type: "input_image", image_url: u }))];
                return { role: "user", content: c };
            }
            return { role: "assistant", content: [{ type: "output_text", text: m.full_text }] };
        });
        return { model, instructions: "You are a helpful AI assistant. Respond clearly and completely in the user's language.", input, reasoning: { effort, summary: "auto" }, store: false, stream };
    }
    const formatted = messages.map(m => {
        if (m.role === "user" && m.image_urls && m.image_urls.length) {
            return { role: "user", content: [{ type: "text", text: m.full_text }, ...m.image_urls.map(u => ({ type: "image_url", image_url: { url: u } }))] };
        }
        return { role: m.role, content: m.full_text };
    });
    const p = { model, messages: formatted, reasoning_effort: effort, stream };
    if (stream) p.stream_options = { include_usage: true };
    return p;
}

async function testConnection() {
    const apiKey = document.getElementById("api-key").value.trim();
    const baseUrl = document.getElementById("base-url").value.trim().replace(/\/$/, "");
    const model = document.getElementById("model").value;
    const logEl = document.getElementById("conn-log");
    logEl.innerText = "Đang kiểm tra kết nối...";
    const logs = [];
    for (const [mName, cfg] of Object.entries(CLIENT_MODES)) {
        try {
            const r = await fetch(`${baseUrl}${cfg.endpoint}`, {
                method: "POST",
                headers: makeHeaders(apiKey, mName),
                body: JSON.stringify(buildPayload([{ role: "user", full_text: "Say OK" }], model, "low", mName, false))
            });
            if (r.ok) {
                document.getElementById("mode").value = mName;
                logEl.innerHTML = `<span style="color:#10a37f">✅ Kết nối tốt nhất: ${mName}</span>`;
                return;
            }
            logs.push(`❌ ${mName}: HTTP ${r.status}`);
        } catch (e) {
            logs.push(`⚠️ ${mName}: ${e.message}`);
        }
    }
    logEl.innerHTML = `<span style="color:#f85149">${logs.join("<br>")}</span>`;
}

async function checkBalance() {
    const apiKey = document.getElementById("api-key").value.trim();
    const baseUrl = document.getElementById("base-url").value.trim().replace(/\/v1\/?$/, "");
    const box = document.getElementById("balance-box");
    box.innerHTML = '<div class="caption">Đang kiểm tra số dư...</div>';
    for (const ep of ["/dashboard/billing/credit_grants", "/dashboard/billing/subscription", "/billing/credit_grants"]) {
        try {
            const r = await fetch(`${baseUrl}${ep}`, { headers: { "Authorization": `Bearer ${apiKey}` } });
            if (r.ok) {
                const bal = await r.json();
                const granted = bal.total_granted || bal.hard_limit_usd || 0;
                let used = bal.total_used || bal.total_usage || 0;
                if (used > 1000) used /= 100;
                const rem = granted ? granted - used : 0;
                box.innerHTML = `<div class="balance-card"><div class="balance-label">💳 Số dư còn lại</div><div class="balance-amount">$${rem.toFixed(2)}</div><div class="balance-label">Đã dùng: $${used.toFixed(2)} / $${granted.toFixed(2)}</div></div>`;
                return;
            }
        } catch {}
    }
    box.innerHTML = '<div class="caption" style="color:#f85149">API không hỗ trợ xem số dư hoặc bị chặn CORS.</div>';
}

async function sendMessage() {
    const input = document.getElementById("msg-input");
    const fileInput = document.getElementById("file-input");
    let text = input.value.trim();
    const files = [...fileInput.files];
    if (!text && !files.length) return;
    if (!text && files.length) text = "Hãy phân tích và tóm tắt chi tiết nội dung các tệp đính kèm này.";

    const docTexts = [], imageUrls = [], attachedNames = [];
    for (const f of files) {
        attachedNames.push(f.name);
        if (f.type.startsWith("image/")) imageUrls.push(await compressImage(f));
        else docTexts.push(await readTextFile(f));
    }
    const fullText = docTexts.length ? `${text}\n\n${docTexts.join("\n\n")}` : text;
    input.value = ""; fileInput.value = ""; updateFileCount();

    if (!convs[currentId]) convs[currentId] = { id: currentId, title: text.slice(0, 55), updated: Date.now(), messages: [] };
    convs[currentId].messages.push({ role: "user", display_text: text, full_text: fullText, image_urls: imageUrls, attached_names: attachedNames });
    convs[currentId].updated = Date.now();
    appendBubble("user", text, "", "", imageUrls, attachedNames);

    const apiKey = document.getElementById("api-key").value.trim();
    const baseUrl = document.getElementById("base-url").value.trim().replace(/\/$/, "");
    let activeMode = document.getElementById("mode").value;
    let activeModel = document.getElementById("model").value;
    const levelLabel = document.getElementById("effort").value;
    let effort = resolveEffort(levelLabel, text, files.length > 0);
    const mult = parseFloat(document.getElementById("multiplier").value) || 0.25;
    const autoFallback = document.getElementById("auto-fallback").checked;

    const aiRow = appendBubble("assistant", "");
    const bubble = aiRow.querySelector(".bubble");
    const contentEl = aiRow.querySelector(".content");
    const metaEl = aiRow.querySelector(".meta");
    const thinkEl = document.createElement("div");
    thinkEl.className = "thinking-card";
    bubble.insertBefore(thinkEl, contentEl);

    const t0 = Date.now();
    const updateThink = (phase) => {
        const sec = ((Date.now() - t0) / 1000).toFixed(1);
        thinkEl.innerHTML = `<svg class="thinking-logo" viewBox="0 0 24 24"><path d="${OPENAI_PATH}"/></svg><span><strong>${phase}</strong> (${activeModel} · ${effort} · ${sec}s)</span><span class="thinking-dots"><span></span><span></span><span></span></span>`;
    };
    updateThink("Đang gửi & suy nghĩ");

    document.getElementById("send-btn").disabled = true;
    document.getElementById("status").innerText = "Đang xử lý...";

    let answer = "", reasoning = "", reasonEl = null, usage = null, lastErr = null;

    for (let attempt = 1; attempt <= 5; attempt++) {
        try {
            const cfg = CLIENT_MODES[activeMode];
            const res = await fetch(`${baseUrl}${cfg.endpoint}`, {
                method: "POST",
                headers: makeHeaders(apiKey, activeMode),
                body: JSON.stringify(buildPayload(convs[currentId].messages, activeModel, effort, activeMode, true))
            });
            if (!res.ok) throw new Error(`HTTP ${res.status} - ${await res.text()}`);

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = "";
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const lines = buf.split("\n");
                buf = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith("data: ")) continue;
                    const str = line.slice(6).trim();
                    if (str === "[DONE]") break;
                    try {
                        const obj = JSON.parse(str);
                        if (obj.usage) usage = obj.usage;
                        const delta = obj.choices?.[0]?.delta || {};
                        const rPiece = delta.reasoning_content || delta.reasoning || (["response.reasoning_summary_text.delta", "response.reasoning_text.delta"].includes(obj.type) ? obj.delta : "");
                        if (rPiece) {
                            reasoning += rPiece;
                            updateThink("Đang tư duy từng bước");
                            if (!reasonEl) {
                                reasonEl = document.createElement("details");
                                reasonEl.className = "reasoning";
                                reasonEl.open = true;
                                reasonEl.innerHTML = "<summary>💭 Quá trình tư duy của AI (đang chạy...)</summary><div></div>";
                                bubble.insertBefore(reasonEl, contentEl);
                            }
                            reasonEl.querySelector("div").innerHTML = marked.parse(reasoning);
                        }
                        const cPiece = delta.content || (["response.output_text.delta", "response.content_part.delta"].includes(obj.type) ? obj.delta : "");
                        if (cPiece) {
                            thinkEl.remove();
                            answer += cPiece;
                            contentEl.innerHTML = marked.parse(answer);
                        }
                        if (obj.type === "response.completed" && obj.response?.usage) usage = obj.response.usage;
                        document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
                    } catch {}
                }
            }
            lastErr = null;
            break;
        } catch (ex) {
            lastErr = ex;
            const errStr = ex.message.toLowerCase();
            const is503 = errStr.includes("http 503");
            if (!answer && attempt < 5) {
                if ((effort === "max" || effort === "xhigh") && (is503 || errStr.includes("http 400"))) effort = "high";
                if (autoFallback && is503 && attempt === 2 && activeMode === "Codex CLI (/v1/responses)") {
                    activeMode = "OpenCode (/v1/chat/completions)";
                    const n = document.createElement("div"); n.className = "notice-box"; n.innerText = `⚠️ Lỗi 503 → Tự chuyển sang ${activeMode}`;
                    bubble.insertBefore(n, thinkEl);
                } else if (autoFallback && is503 && attempt >= 3 && activeModel !== "gpt-6.1-sol") {
                    activeModel = "gpt-6.1-sol";
                    const n = document.createElement("div"); n.className = "notice-box"; n.innerText = "⚠️ Kênh bận (503) → Tự chuyển sang gpt-6.1-sol";
                    bubble.insertBefore(n, thinkEl);
                }
                updateThink(`Đang thử lại (${attempt + 1}/5)`);
                await new Promise(r => setTimeout(r, 600));
                continue;
            }
            break;
        }
    }

    thinkEl.remove();
    if (lastErr && !answer) {
        contentEl.innerHTML = `<span style="color:#f85149">Lỗi gọi API: ${lastErr.message}</span>`;
    } else {
        const sec = ((Date.now() - t0) / 1000).toFixed(1);
        if (reasonEl) {
            reasonEl.querySelector("summary").innerText = `✅ Đã suy nghĩ xong trong ${sec}s`;
            reasonEl.open = false;
        }
        decorateCodeBlocks(aiRow);
        addCopyButtons(aiRow, answer);

        let meta = `📊 ${activeModel} (${levelLabel} → ${effort} · ${sec}s)`;
        if (usage) {
            const inTok = usage.prompt_tokens || usage.input_tokens || 0;
            const outTok = usage.completion_tokens || usage.output_tokens || 0;
            const cacheTok = (usage.prompt_tokens_details || usage.input_tokens_details || {}).cached_tokens || 0;
            const rate = activeModel.includes("astra") ? MODEL_PRICING["gpt-6-astra"] : MODEL_PRICING["gpt-6.1-sol"];
            const cost = ((Math.max(0, inTok - cacheTok) * rate.input + cacheTok * rate.cached + outTok * rate.output) / 1e6) * mult;
            const totalTok = inTok + outTok;
            sessionCost += cost;
            sessionTokens += totalTok;

            const today = new Date().toISOString().slice(0, 10);
            stats.total_tokens += totalTok;
            stats.total_cost += cost;
            stats.total_messages += 1;
            if (!stats.daily[today]) stats.daily[today] = { tokens: 0, cost: 0, messages: 0, input_tokens: 0, output_tokens: 0 };
            stats.daily[today].tokens += totalTok;
            stats.daily[today].cost += cost;
            stats.daily[today].messages += 1;
            stats.daily[today].input_tokens += inTok;
            stats.daily[today].output_tokens += outTok;
            meta += ` | Input: ${inTok.toLocaleString()}${cacheTok ? ` (Cache: ${cacheTok.toLocaleString()})` : ""} · Output: ${outTok.toLocaleString()} | Chi phí: $${cost.toFixed(6)}`;
        }
        metaEl.innerText = meta;
        convs[currentId].messages.push({ role: "assistant", display_text: answer, full_text: answer, reasoning_text: reasoning.trim(), meta });
        saveState();
        renderSidebar();
    }

    document.getElementById("send-btn").disabled = false;
    document.getElementById("status").innerText = "Sẵn sàng";
}

document.getElementById("msg-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

initParticles();
updateEffortDesc();
renderAll();
</script>
